<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | NaijaBuy&Sell</title><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:950px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:10px}.btn{display:inline-block;padding:9px 12px;background:#16823b;color:#fff;border-radius:8px;text-decoration:none}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a><nav><a href="dashboard.html">Dashboard</a></nav></div></header><main class="wrap"><h1>My Orders</h1><div id="list">Loading...</div></main><script type="module">import {supabase} from './src/supabase-client.js';const l=document.querySelector('#list');async function run(){const {data:{user}}=await supabase.auth.getUser();if(!user){l.textContent='Please sign in.';return}const {data,error}=await supabase.from('orders').select('id,item_amount,delivery_fee,total_amount,protection_status,delivery_status,created_at').or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`).order('created_at',{ascending:false});if(error)throw error;l.innerHTML=data?.length?data.map(o=>`<article class="card"><b>Order ${o.id.slice(0,8)}</b><p>₦${Number(o.total_amount||0).toLocaleString()} · ${o.protection_status} · ${o.delivery_status}</p><small>${new Date(o.created_at).toLocaleString()}</small></article>`).join(''):'<p>No orders yet.</p>'}run().catch(e=>l.textContent=e.message||'Unable to load orders.') </script></body></html>
