<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | NaijaBuy&Sell</title><style>body{font-family:Arial;background:#f5f7f5}.box{max-width:430px;margin:60px auto;background:#fff;padding:28px;border-radius:16px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0}button{background:#16853b;color:#fff;border:0;border-radius:8px;font-weight:bold}</style><main class="box"><h1>NaijaBuy&Sell</h1><p>Login to your account.</p><form id=f><input id=e type=email placeholder="Email" required><input id=p type=password placeholder="Password" required><button>Login</button></form><p id=m></p><a href="register.html">Create an account</a></main><script type=module>import{signIn}from'./src/app-backend.js';f.onsubmit=async x=>{x.preventDefault();m.textContent='Signing in...';try{await signIn(e.value,p.value);location.href='index.html'}catch(z){m.textContent=z.message}}</script>
