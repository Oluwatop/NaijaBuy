<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages | NaijaBuy&Sell</title><meta name="description" content="Buyer and seller messages on NaijaBuy&Sell."><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:1050px;margin:auto;padding:24px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px}.layout{display:grid;grid-template-columns:320px 1fr;gap:15px}.threads{display:grid;gap:8px}.thread{padding:12px;border:1px solid #ddd;border-radius:10px;cursor:pointer}.thread.unread{font-weight:800;border-left:4px solid #16823b}.chat{min-height:430px;display:flex;flex-direction:column}.msgs{flex:1;display:grid;align-content:start;gap:8px;margin-bottom:12px}.msg{padding:10px 12px;border-radius:10px;background:#f0f0f0;max-width:75%}.mine{margin-left:auto;background:#e5f4e9}.send{display:flex;gap:8px}.send textarea{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#16823b;color:#fff;font-weight:700}@media(max-width:750px){.layout{grid-template-columns:1fr}.chat{min-height:350px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a><nav><a href="property-search.html">Properties</a><a href="messages.html">Messages</a></nav></div></header><main class="wrap"><h1>Messages</h1><div class="layout"><section class="panel"><h2>Conversations</h2><div id="threads">Loading...</div></section><section class="panel chat"><div id="chat"><p>Select a conversation.</p></div></section></div></main><script type="module">import {getConversations,getMessages,sendMessage,subscribeToMessages,markConversationRead} from './src/messaging.js';let current=null,sub=null;const t=document.querySelector('#threads'),c=document.querySelector('#chat');const esc=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[z]));async function load(){const a=await getConversations();t.innerHTML=a.length?a.map(x=>`<div class="thread ${x.unread?'unread':''}" data-id="${x.id}"><b>${esc(x.listing_title||'Marketplace enquiry')}</b><br><small>${esc(x.other_name||'User')} ${x.unread?'• unread':''}</small></div>`).join(''):'<p>No conversations yet.</p>';t.querySelectorAll('.thread').forEach(x=>x.onclick=()=>open(x.dataset.id));}async function open(id){current=id;if(sub)sub();await markConversationRead(id);const a=await getMessages(id);c.innerHTML='<div class="msgs">'+a.map(x=>`<div class="msg ${x.mine?'mine':''}">${esc(x.body)}</div>`).join('')+'</div><div class="send"><textarea id="body" placeholder="Write a message..."></textarea><button class="btn" id="send">Send</button></div>';document.querySelector('#send').onclick=async()=>{const b=document.querySelector('#body');if(b.value.trim()){await sendMessage(id,b.value.trim());b.value='';await open(id)}};sub=subscribeToMessages(id,()=>open(id));await load()}load().catch(e=>t.textContent=e.message||'Please sign in.') </script></body></html>
