<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | NaijaBuy&Sell</title><meta name="description" content="Marketplace notifications on NaijaBuy&Sell."><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:900px;margin:auto;padding:24px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}.notice{padding:14px;border-bottom:1px solid #ddd}.unread{font-weight:800;background:#f5fbf6}.btn{padding:10px 14px;border:0;border-radius:8px;background:#16823b;color:#fff;font-weight:700}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a><nav><a href="messages.html">Messages</a></nav></div></header><main class="wrap"><section class="panel"><h1>Notifications</h1><button class="btn" id="read">Mark all as read</button><div id="list">Loading...</div></section></main><script type="module">import {getNotifications,markAllNotificationsRead} from './src/notifications.js';const l=document.querySelector('#list');const esc=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[z]));async function run(){const a=await getNotifications();l.innerHTML=a.length?a.map(x=>`<div class="notice ${x.read_at?'':'unread'}"><b>${esc(x.title)}</b><p>${esc(x.body)}</p><small>${new Date(x.created_at).toLocaleString()}</small></div>`).join(''):'<p>No notifications.</p>'}document.querySelector('#read').onclick=async()=>{await markAllNotificationsRead();run()};run().catch(e=>l.textContent=e.message||'Please sign in.') </script></body></html>
