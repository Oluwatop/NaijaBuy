<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | NaijaBuy&Sell</title><style>body{font-family:Arial;background:#f5f7f5}.box{max-width:430px;margin:60px auto;background:#fff;padding:28px;border-radius:16px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0}button{background:#16853b;color:#fff;border:0;border-radius:8px;font-weight:bold}</style><main class="box"><h1>Create Account</h1><form id=f><input id=n placeholder="Full name" required><input id=e type=email placeholder="Email" required><input id=p type=password minlength=8 placeholder="Password (8+ characters)" required><button>Create Account</button></form><p id=m></p><a href="login.html">Already have an account?</a></main><script type=module>import{signUp}from'./src/app-backend.js';f.onsubmit=async x=>{x.preventDefault();m.textContent='Creating account...';try{await signUp(e.value,p.value,n.value);m.textContent='Account created. Check your email if verification is enabled.'}catch(z){m.textContent=z.message}}</script>
