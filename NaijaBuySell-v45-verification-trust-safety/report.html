<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report a Listing | NaijaBuy&Sell</title><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:700px;margin:auto;padding:24px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:8px}.btn{padding:11px 16px;background:#16823b;color:#fff;border:0;border-radius:8px;font-weight:700}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a></div></header><main class="wrap"><section class="panel"><h1>Report a Listing</h1><p>Help us review suspicious or misleading marketplace activity.</p><form id="form"><div class="field"><label>Listing ID</label><input name="listing_id" required></div><div class="field"><label>Reason</label><select name="reason" required><option value="">Select</option><option>Fraud or scam</option><option>Misleading information</option><option>Prohibited item</option><option>Duplicate/spam</option><option>Other</option></select></div><div class="field"><label>Details</label><textarea name="details" rows="6" maxlength="2000" required></textarea></div><button class="btn">Submit report</button></form><p id="msg"></p></section></main><script type="module">import {supabase} from './src/supabase-client.js';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await supabase.auth.getUser();if(!user){document.querySelector('#msg').textContent='Please sign in first.';return}const f=new FormData(e.target);const {error}=await supabase.from('reports').insert({listing_id:f.get('listing_id'),reporter_id:user.id,reason:f.get('reason'),details:f.get('details')});document.querySelector('#msg').textContent=error?error.message:'Report submitted for review.';if(!error)e.target.reset()};</script></body></html>
