<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Properties | NaijaBuy&Sell</title><meta name="description" content="Your saved properties on NaijaBuy&Sell."><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:1000px;margin:auto;padding:24px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid #ddd;border-radius:12px;padding:15px}.btn{display:inline-block;padding:9px 12px;border-radius:8px;background:#16823b;color:#fff;text-decoration:none}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a><nav><a href="property-search.html">Properties</a></nav></div></header><main class="wrap"><section class="panel"><h1>Saved Properties</h1><div id="results">Loading...</div></section></main><script type="module">import {getSavedProperties} from './src/property-favorites.js';const r=document.querySelector('#results');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));getSavedProperties().then(a=>r.innerHTML=a.length?'<div class="grid">'+a.map(x=>`<article class="card"><h3>${esc(x.title)}</h3><p>₦${Number(x.price||0).toLocaleString()}</p><p>${esc(x.city)}, ${esc(x.state)}</p><a class="btn" href="property.html?id=${encodeURIComponent(x.id)}">View property</a></article>`).join('')+'</div>':'<p>No saved properties yet.</p>').catch(e=>r.textContent=e.message||'Please sign in.') </script></body></html>
