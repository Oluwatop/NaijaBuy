<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Verification Queue | NaijaBuy&Sell</title><meta name="description" content="Admin property verification queue."><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:1100px;margin:auto;padding:24px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;border-bottom:1px solid #ddd;padding:14px 0;align-items:center}.btn{padding:9px 12px;border:0;border-radius:8px;background:#16823b;color:#fff;font-weight:700}.danger{background:#a52626}@media(max-width:800px){.row{grid-template-columns:1fr}.head{display:none}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a><nav><a href="admin-moderation.html">Admin</a></nav></div></header><main class="wrap"><section class="panel"><h1>Property Verification Queue</h1><p>Review evidence before granting verification. Do not approve ownership or agency claims without appropriate evidence.</p><div class="row head"><b>Property</b><b>Seller</b><b>Status</b><b>Action</b></div><div id="queue">Loading...</div></section></main><script type="module">import {getVerificationQueue,updatePropertyVerification} from './src/property-verification.js';const q=document.querySelector('#queue');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){try{const a=await getVerificationQueue();q.innerHTML=a.length?a.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><br>${esc(x.city)}, ${esc(x.state)}</div><div>${esc(x.seller_name||'Seller')}</div><div>${esc(x.property_verification_status||'not_reviewed')}</div><div><button class="btn" data-id="${x.id}" data-s="verified">Verify</button> <button class="btn danger" data-id="${x.id}" data-s="rejected">Reject</button></div></div>`).join(''):'<p>No properties waiting for verification.</p>';q.querySelectorAll('button').forEach(b=>b.onclick=async()=>{await updatePropertyVerification(b.dataset.id,b.dataset.s);run()})}catch(e){q.textContent=e.message||'Admin access required.'}}run();</script></body></html>
