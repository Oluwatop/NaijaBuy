<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Enquiry | NaijaBuy&Sell</title><meta name="description" content="Send a property enquiry to a seller or agent on NaijaBuy&Sell."><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:800px;margin:auto;padding:24px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:22px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}input,textarea{padding:12px;border:1px solid #ccc;border-radius:9px}textarea{min-height:130px}.btn{padding:12px 17px;border:0;border-radius:9px;background:#16823b;color:#fff;font-weight:700}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a><nav><a href="property-search.html">Properties</a></nav></div></header><main class="wrap"><section class="panel"><h1>Property Enquiry</h1><p id="property">Loading property...</p><form id="f"><label class="field">Your message<textarea name="message" required placeholder="Hello, I am interested in this property..."></textarea></label><button class="btn">Send enquiry</button></form><p id="msg"></p></section></main><script type="module">import {sendPropertyEnquiry,getPropertySummary} from './src/property-enquiry.js';const id=new URLSearchParams(location.search).get('id');const p=document.querySelector('#property'),m=document.querySelector('#msg');getPropertySummary(id).then(x=>p.textContent=x?x.title:'Property unavailable');document.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{await sendPropertyEnquiry(id,new FormData(e.target).get('message'));m.textContent='Enquiry sent successfully.';e.target.reset()}catch(x){m.textContent=x.message||'Please sign in before sending an enquiry.'}}</script></body></html>
