<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Property Search | NaijaBuy&Sell</title><meta name="description" content="Search houses, apartments, land and commercial properties across Nigeria."><link rel="stylesheet" href="src/styles.css">
<style>.wrap{max-width:1100px;margin:auto;padding:25px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-bottom:18px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #ddd;border-radius:12px;padding:15px}.muted{color:#666}input,select{padding:11px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box}.btn{padding:11px 16px;border:0;border-radius:8px;background:#16823b;color:#fff;font-weight:700}@media(max-width:800px){.filters,.cards{grid-template-columns:1fr 1fr}}@media(max-width:500px){.filters,.cards{grid-template-columns:1fr}}</style></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a><nav><a href="index.html">Home</a><a href="property-search.html">Properties</a><a href="property-listing.html">List Property</a></nav></div></header>
<main class="wrap"><section class="panel"><h1>Find Properties in Nigeria</h1><div class="filters">
<select id="type"><option value="">All property types</option><option>House</option><option>Apartment/Flat</option><option>Land</option><option>Office/Commercial</option><option>Shop</option><option>Warehouse</option><option>Estate/Development</option><option>Short-let</option></select>
<select id="purpose"><option value="">Sale, rent or lease</option><option>For Sale</option><option>For Rent</option><option>For Lease</option></select>
<input id="state" placeholder="State"><input id="city" placeholder="City"><input id="min" type="number" placeholder="Min price"><input id="max" type="number" placeholder="Max price"><input id="beds" type="number" min="0" placeholder="Min bedrooms"><select id="furnished"><option value="">Any furnishing</option><option value="true">Furnished</option><option value="false">Unfurnished</option></select>
<button class="btn" id="search">Search properties</button></div></section><section class="panel"><div id="results">Loading...</div></section></main>
<script type="module">import {searchProperties} from './src/property-service.js';const r=document.querySelector('#results'),e=id=>document.querySelector('#'+id).value;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){r.textContent='Searching...';try{const a=await searchProperties({property_type:e('type'),listing_purpose:e('purpose'),state:e('state'),city:e('city'),min_price:e('min'),max_price:e('max'),min_bedrooms:e('beds'),furnished:e('furnished')});r.innerHTML=a.length?'<div class="cards">'+a.map(x=>`<article class="card"><h3><a href="property.html?id=${encodeURIComponent(x.id)}">${esc(x.title)}</a></h3><b>₦${Number(x.price||0).toLocaleString()}</b><p>${esc(x.property_type)} · ${esc(x.listing_purpose)}</p><p>${esc(x.city)}, ${esc(x.state)}</p><p>${esc(x.description||'').slice(0,160)}</p></article>`).join('')+'</div>':'<p class="muted">No approved properties matched your search.</p>'}catch(x){r.textContent=x.message||'Search unavailable.'}}document.querySelector('#search').onclick=run;run();</script></body></html>
