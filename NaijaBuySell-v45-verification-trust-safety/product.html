<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — NaijaBuy&Sell</title><meta name="description" content="View product details on NaijaBuy&Sell."><meta property="og:type" content="product"><link rel="stylesheet" href="src/styles.css"></head><body><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">N</span><span>NaijaBuy<span>&</span>Sell</span></a><nav><a href="index.html">Home</a><a href="search.html">Browse</a><a href="categories.html">Categories</a></nav><a class="sell" href="seller.html">Sell an Item</a></div></header><main class="wrap section"><div id="crumb" class="crumb"></div><div id="product"></div></main><footer><div class="wrap footer"><div><b>NaijaBuy&Sell</b><p>Your Trusted Online Marketplace</p></div><div><a href="saved.html">Saved</a><a href="help.html">Help</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a></div></div></footer><script src="src/data.js"></script><script>const p=products.find(x=>x.id===Number(new URLSearchParams(location.search).get("id")))||products[0];document.title=p.title+" for Sale in "+p.location+" — NaijaBuy&Sell";document.querySelector("#crumb").innerHTML='<a href="index.html">Home</a> / <a href="category.html?cat='+encodeURIComponent(p.category)+'">'+p.category+'</a> / '+p.title;document.querySelector("#product").innerHTML=`<div class="detail"><div><div class="mainphoto">${p.emoji}</div><div class="thumbs"><span>${p.emoji}</span><span>📦</span><span>🔍</span></div></div><div class="detail-copy"><span class="badge">${p.condition}</span><h1>${p.title}</h1><div class="price">${money(p.price)}</div><p class="muted">📍 ${p.location} · ${p.category}</p><p>${p.description}</p><div class="sellerbox"><span class="small">SELLER</span><h3>${p.seller}</h3><p>✓ Seller profile preview</p><a href="seller-profile.html?seller=${encodeURIComponent(p.seller)}">View seller profile →</a></div><div class="actions"><button class="button" onclick="alert('Checkout preview only. Payment backend is not connected yet.')">Buy securely</button><button class="ghost" onclick="save(${p.id})">♡ Save</button><button class="ghost" onclick="share()">↗ Share</button></div><div class="notice"><b>Protected transaction journey</b><br>Buyer pays → seller delivers → buyer confirms receipt → payout release.</div></div></div><section class="section"><div class="section-head"><h2>Related products</h2><a href="search.html">Browse more →</a></div><div class="grid">${products.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4).map(card).join("")}</div></section>`;let ld={"@context":"https://schema.org","@type":"Product","name":p.title,"description":p.description,"category":p.category,"offers":{"@type":"Offer","price":p.price,"priceCurrency":"NGN","availability":"https://schema.org/InStock"}};let s=document.createElement("script");s.type="application/ld+json";s.textContent=JSON.stringify(ld);document.head.appendChild(s);function save(id){let a=JSON.parse(localStorage.saved||"[]");a=a.includes(id)?a.filter(x=>x!==id):a.concat(id);localStorage.saved=JSON.stringify(a);alert(a.includes(id)?"Saved.":"Removed from saved items.")}function share(){if(navigator.share)navigator.share({title:p.title,text:p.title+" on NaijaBuy&Sell",url:location.href});else alert(location.href)}</script></body></html>
