<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Dashboard | NaijaBuy&Sell</title><meta name="description" content="Manage real estate listings on NaijaBuy&Sell."><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:1050px;margin:auto;padding:24px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;background:#f5f5f5;border-radius:12px}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #ddd;padding:13px;border-radius:10px}.btn{padding:9px 13px;border-radius:8px;background:#16823b;color:white;font-weight:700;text-decoration:none}.muted{color:#666}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{flex-direction:column;align-items:flex-start}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a><nav><a href="agent-dashboard.html">Agent Dashboard</a><a href="property-listing.html">List Property</a><a href="property-search.html">Browse</a></nav></div></header><main class="wrap"><section class="panel"><h1>Agent / Property Seller Dashboard</h1><p class="muted">Manage your property listings and monitor moderation status.</p><div class="stats"><div class="stat"><b id="total">0</b><br>Total listings</div><div class="stat"><b id="approved">0</b><br>Approved</div><div class="stat"><b id="pending">0</b><br>Pending review</div><div class="stat"><b id="verification">—</b><br>Verification</div></div></section><section class="panel"><h2>My properties</h2><div id="list">Loading...</div></section></main><script type="module">import {getAgentDashboard} from './src/agent-dashboard.js';const el=document.querySelector('#list');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function run(){try{const d=await getAgentDashboard();document.querySelector('#total').textContent=d.listings.length;document.querySelector('#approved').textContent=d.listings.filter(x=>x.status==='approved').length;document.querySelector('#pending').textContent=d.listings.filter(x=>x.status==='pending').length;document.querySelector('#verification').textContent=d.verification_status||'unverified';el.innerHTML=d.listings.length?'<div class="list">'+d.listings.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><br><span class="muted">${esc(x.property_type)} · ${esc(x.listing_purpose)} · ${esc(x.city)}, ${esc(x.state)}</span></div><span>${esc(x.status)}</span><a class="btn" href="property.html?id=${encodeURIComponent(x.id)}">View</a></div>`).join('')+'</div>':'<p>No property listings yet.</p>'}catch(e){el.textContent=e.message||'Please sign in to use the dashboard.'}}run();</script></body></html>
