<!doctype html><html lang="en-NG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trust & Safety Admin | NaijaBuy&Sell</title><link rel="stylesheet" href="src/styles.css"><style>.wrap{max-width:1100px;margin:auto;padding:24px 16px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}.row{padding:12px;border-bottom:1px solid #eee}.badge{padding:4px 8px;border-radius:99px;background:#fff3cd}.btn{padding:9px 12px;border:0;border-radius:7px;background:#16823b;color:#fff}</style></head><body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">NaijaBuy<span>&</span>Sell</a></div></header><main class="wrap"><section class="panel"><h1>Trust & Safety Review</h1><p id="access">Checking administrator access...</p><div id="list"></div></section></main><script type="module">import {supabase} from './src/supabase-client.js';const a=document.querySelector('#access'),l=document.querySelector('#list');async function run(){const {data:{user}}=await supabase.auth.getUser();if(!user){a.textContent='Access denied.';return}const {data:r}=await supabase.from('admin_roles').select('role').eq('user_id',user.id).maybeSingle();if(!r){a.textContent='Access denied.';return}a.textContent='Administrator access confirmed.';const {data,error}=await supabase.from('reports').select('id,listing_id,reason,details,status,created_at').order('created_at',{ascending:false}).limit(100);if(error)throw error;l.innerHTML=data?.length?data.map(x=>`<div class="row"><b>${x.reason}</b> <span class="badge">${x.status||'open'}</span><p>Listing: ${x.listing_id}</p><p>${String(x.details||'')}</p><small>${new Date(x.created_at).toLocaleString()}</small></div>`).join(''):'No reports found.'}run().catch(e=>a.textContent=e.message||'Unable to load reports.') </script></body></html>
